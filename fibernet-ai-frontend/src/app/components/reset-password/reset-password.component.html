<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card app-card auth-card">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <div class="auth-icon mb-2">
                <i class="bi bi-shield-check"></i>
              </div>
              <h3 class="mb-1">Reinitialiser le mot de passe</h3>
              <p class="text-muted mb-0">Definissez un nouveau mot de passe</p>
            </div>

            <form #resetForm="ngForm" (ngSubmit)="onSubmit(resetForm)">
              <div class="mb-3">
                <label class="form-label fw-semibold">Nouveau mot de passe</label>
                <input
                  type="password"
                  class="form-control"
                  name="password"
                  [(ngModel)]="password"
                  #passwordCtrl="ngModel"
                  required
                  minlength="6">
                <div *ngIf="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched)" class="text-danger small mt-1">
                  Mot de passe requis (min 6 caracteres).
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Confirmation</label>
                <input
                  type="password"
                  class="form-control"
                  name="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  #confirmCtrl="ngModel"
                  required
                  minlength="6">
                <div *ngIf="confirmCtrl.invalid && (confirmCtrl.dirty || confirmCtrl.touched)" class="text-danger small mt-1">
                  Confirmation requise.
                </div>
                <div *ngIf="confirmCtrl.valid && password !== confirmPassword" class="text-danger small mt-1">
                  Les mots de passe ne correspondent pas.
                </div>
              </div>

              <div *ngIf="success" class="alert alert-success">
                <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
              </div>

              <div *ngIf="error" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
              </div>

              <button class="btn btn-primary w-100 btn-animated" type="submit" [disabled]="resetForm.invalid || loading || !token || password !== confirmPassword">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Reinitialiser
              </button>
            </form>

            <div class="text-center mt-3">
              <a routerLink="/login">Retour a la connexion</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
