<div class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card app-card auth-card">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <div class="auth-icon mb-2">
                <i class="bi bi-envelope"></i>
              </div>
              <h3 class="mb-1">Mot de passe oublie</h3>
              <p class="text-muted mb-0">Recevez un lien de reinitialisation</p>
            </div>

            <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)">
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control"
                  name="email"
                  [(ngModel)]="email"
                  #emailCtrl="ngModel"
                  required
                  email
                  autocomplete="email">
                <div *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)" class="text-danger small mt-1">
                  Email valide requis.
                </div>
              </div>

              <div *ngIf="success" class="alert alert-success">
                <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
              </div>

              <div *ngIf="error" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
              </div>

              <button class="btn btn-primary w-100 btn-animated" type="submit" [disabled]="forgotForm.invalid || loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Envoyer le lien
              </button>
            </form>

            <div class="text-center mt-3">
              <a routerLink="/login">Retour a la connexion</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
